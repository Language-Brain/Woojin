<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="언어와 뇌의 공개 논문·뉴스·연구 원고를 제목, 본문, 태그로 검색합니다.">
  <meta name="robots" content="index,follow">
  <title>주요 글 검색 | 언어와 뇌</title>
  <link rel="canonical" href="https://languagebrain.vercel.app/search">
  <link rel="stylesheet" href="/search/search.css">
</head>
<body>
  <header class="site-header"><a href="/">언어와 뇌</a><nav><a href="/guides">자료 안내 검색</a><a href="/">홈</a></nav></header>
  <main>
    <section class="search-head"><p>논문·뉴스·연구 원고</p><h1>주요 글 검색</h1><form id="post-search"><input id="q" name="q" type="search" maxlength="100" placeholder="제목·본문·태그 검색" aria-label="주요 글 검색"><button type="submit" aria-label="검색">⌕</button></form><a id="guide-search-link" class="guide-link" href="/guides">자료 안내 문서에서도 찾기 →</a></section>
    <section class="results" aria-live="polite"><div class="results-head"><h2>검색 결과</h2><span id="result-count"></span></div><div id="result-list"><p class="empty">검색어 또는 글의 태그를 선택해 주세요.</p></div></section>
  </main>
  <script src="/api/config"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
  (()=>{const fallback={supabaseUrl:'https://vhaosgzyvoijgwryybry.supabase.co',supabasePublishableKey:'sb_publishable_Obv4RYPtgwB71vZ4vOM0iA_jxPfeuZa'},config=window.LANGUAGE_BRAIN_CONFIG?.supabaseUrl?window.LANGUAGE_BRAIN_CONFIG:fallback,db=supabase.createClient(config.supabaseUrl,config.supabasePublishableKey),params=new URLSearchParams(location.search),input=document.querySelector('#q'),list=document.querySelector('#result-list'),count=document.querySelector('#result-count'),labels={paper:'논문·연구 소개',news:'뉴스·기사 소개',works:'칼럼·연구 원고'};input.value=params.get('q')||'';const text=value=>String(value||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim(),date=value=>value?new Date(value).toLocaleDateString('ko-KR'):'';
  function card(row){const article=document.createElement('article'),a=document.createElement('a'),kind=document.createElement('span'),h=document.createElement('h3'),p=document.createElement('p'),tags=document.createElement('div'),meta=document.createElement('small');article.className='result';a.href='/article?id='+encodeURIComponent(row.id);kind.className='kind kind-'+row.type;kind.textContent=labels[row.type]||'글';h.textContent=row.title;p.textContent=row.excerpt||text(row.content_html).slice(0,180);(Array.isArray(row.tags)?row.tags:[]).map(tag=>String(tag||'').trim().replace(/^#+\\s*/,'')).filter(Boolean).forEach(tag=>{const link=document.createElement('a');link.className='tag';link.href='/search?q='+encodeURIComponent(tag);link.textContent='#'+tag;tags.append(link)});tags.className='tags';meta.textContent=date(row.published_at||row.updated_at);a.append(kind,h,p);article.append(a,tags,meta);return article}
  async function search(){const term=input.value.trim();document.querySelector('#guide-search-link').href='/guides'+(term?'?q='+encodeURIComponent(term):'');if(!term){count.textContent='';return}list.innerHTML='<p class="empty">찾고 있습니다.</p>';const{data,error}=await db.from('posts').select('id,type,title,excerpt,content_html,tags,published_at,updated_at').eq('status','published').in('type',['paper','news','works']).order('published_at',{ascending:false}).limit(500);if(error){list.innerHTML='<p class="empty">검색하지 못했습니다. 잠시 후 다시 시도해 주세요.</p>';return}const needle=term.toLocaleLowerCase('ko-KR'),rows=(data||[]).filter(row=>[row.title,row.excerpt,text(row.content_html),...(Array.isArray(row.tags)?row.tags:[])].join(' ').toLocaleLowerCase('ko-KR').includes(needle));count.textContent=rows.length+'건';list.replaceChildren(...(rows.length?rows.map(card):[Object.assign(document.createElement('p'),{className:'empty',textContent:'조건에 맞는 주요 글이 없습니다.'})]))}
  document.querySelector('#post-search').addEventListener('submit',event=>{event.preventDefault();location.href='/search?q='+encodeURIComponent(input.value.trim())});if(input.value)search();})();
  </script>
</body></html>
