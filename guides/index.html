<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>자료 안내 | 언어와 뇌</title><meta name="description" content="강의·스터디·기관 컨설팅 참여자를 위한 웹 문서를 검색합니다.">
<link rel="canonical" href="https://languagebrain.vercel.app/guides"><link rel="stylesheet" href="/guides/guides.css"></head>
<body><header class="site-header"><a href="/">언어와 뇌</a><nav><a href="/">홈</a><a href="/papers">논문</a><a href="/news">뉴스</a><a href="/works">원고</a></nav></header>
<main><section class="search-hero"><p>자료 안내</p><h1>문서를 찾아보세요</h1><form id="guide-search"><input id="q" type="search" maxlength="100" placeholder="제목·강의명·기관명·태그 검색" aria-label="자료 검색"><button aria-label="검색">⌕</button></form><div id="tag-list" class="tags"></div></section>
<section class="results"><div class="results-head"><h2>검색 결과</h2><span id="result-count"></span></div><div id="result-list" class="result-list"><p class="empty">검색어 또는 태그를 선택해 주세요.</p></div></section></main>
<script src="/api/config"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const fallback={supabaseUrl:'https://vhaosgzyvoijgwryybry.supabase.co',supabasePublishableKey:'sb_publishable_Obv4RYPtgwB71vZ4vOM0iA_jxPfeuZa'},config=window.LANGUAGE_BRAIN_CONFIG?.supabaseUrl?window.LANGUAGE_BRAIN_CONFIG:fallback,db=supabase.createClient(config.supabaseUrl,config.supabasePublishableKey),params=new URLSearchParams(location.search),q=document.querySelector('#q'),list=document.querySelector('#result-list');
q.value=params.get('q')||'';const safe=value=>String(value||'').replace(/[,%()]/g,' ').trim().slice(0,100),date=value=>value?new Date(value).toLocaleDateString('ko-KR'):'-';
async function tags(){const{data}=await db.from('guide_tags').select('name').eq('is_visible',true).order('display_order').limit(12);document.querySelector('#tag-list').replaceChildren(...(data||[]).map(row=>{const a=document.createElement('a');a.href='/guides?q='+encodeURIComponent(row.name);a.textContent='#'+row.name;return a}))}
async function search(){const term=safe(q.value);if(!term)return;list.innerHTML='<p class="empty">찾고 있습니다.</p>';const{data,error}=await db.from('guides').select('id,title,description,body,course_name,institution_name,tags,updated_at,view_count').eq('status','active').eq('visibility','public').order('updated_at',{ascending:false}).limit(300);if(error){list.innerHTML='<p class="empty">검색하지 못했습니다. 잠시 후 다시 시도해 주세요.</p>';return}const needle=term.toLocaleLowerCase('ko-KR'),rows=(data||[]).filter(row=>[row.title,row.description,row.body,row.course_name,row.institution_name,...(row.tags||[])].join(' ').toLocaleLowerCase('ko-KR').includes(needle));document.querySelector('#result-count').textContent=rows.length+'건';list.replaceChildren(...(rows.length?rows.map(row=>{const a=document.createElement('a');a.className='result';a.href='/guide?id='+encodeURIComponent(row.id);const h=document.createElement('h3'),p=document.createElement('p'),meta=document.createElement('span'),tags=document.createElement('div');h.textContent=row.title;p.textContent=row.description;meta.textContent=date(row.updated_at)+' · 조회 '+Number(row.view_count||0).toLocaleString();tags.className='tags';(row.tags||[]).forEach(value=>{const i=document.createElement('i');i.textContent='#'+value;tags.append(i)});a.append(h,p,tags,meta);return a}):[Object.assign(document.createElement('p'),{className:'empty',textContent:'조건에 맞는 자료가 없습니다.'})]))}
document.querySelector('#guide-search').addEventListener('submit',e=>{e.preventDefault();location.href='/guides?q='+encodeURIComponent(q.value.trim())});tags();if(q.value)search();
</script></body></html>
