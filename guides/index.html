<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>자료 안내 | 언어와 뇌</title><meta name="description" content="『평재문집』과 강의·스터디·기관 컨설팅 웹 문서를 검색합니다."><link rel="canonical" href="https://languagebrain.vercel.app/guides"><link rel="stylesheet" href="/guides/guides.css"><style>.scope-tabs{display:flex;gap:6px;margin:12px 0 0}.scope-tabs button{width:auto;border:1px solid #cbd1d5;border-radius:16px;padding:7px 12px;font:700 12px inherit}.scope-tabs button.active{background:var(--navy);color:#fff}.archive-link{display:inline-block;margin-top:10px;color:var(--navy);font-size:12px;font-weight:800}</style></head><body><header class="site-header"><a href="/">언어와 뇌</a><nav><a href="/">홈</a><a href="/pyeongjae">평재문집</a></nav></header><main><section class="search-hero"><p>자료 안내</p><h1>문서를 찾아보세요</h1><form id="guide-search"><input id="q" type="search" maxlength="100" placeholder="제목·강의명·기관명·태그 검색" aria-label="자료 검색"><button aria-label="검색">⌕</button></form><div class="scope-tabs" role="tablist"><button class="active" data-scope="all" type="button">전체</button><button data-scope="pyeongjae" type="button">평재문집</button><button data-scope="other" type="button">기타 자료</button></div><div id="tag-list" class="tags"></div><a class="archive-link" href="/pyeongjae">권차·글 종류로 평재문집 자세히 찾기 →</a></section><section class="results"><div class="results-head"><h2>검색 결과</h2><span id="result-count"></span></div><div id="result-list" class="result-list"><p class="empty">검색어·태그 또는 상위 분류를 선택해 주세요.</p></div></section></main><script src="/api/config"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
const fallback={supabaseUrl:'https://vhaosgzyvoijgwryybry.supabase.co',supabasePublishableKey:'sb_publishable_Obv4RYPtgwB71vZ4vOM0iA_jxPfeuZa'},config=window.LANGUAGE_BRAIN_CONFIG?.supabaseUrl?window.LANGUAGE_BRAIN_CONFIG:fallback,db=supabase.createClient(config.supabaseUrl,config.supabasePublishableKey),params=new URLSearchParams(location.search),q=document.querySelector('#q'),list=document.querySelector('#result-list');let scope=params.get('scope')||'all';q.value=params.get('q')||'';const safe=value=>String(value||'').replace(/[,%()]/g,' ').trim().slice(0,100),date=value=>value?new Date(value).toLocaleDateString('ko-KR'):'-',needle=()=>safe(q.value).toLocaleLowerCase('ko-KR'),match=(hay)=>!needle()||hay.toLocaleLowerCase('ko-KR').includes(needle());
