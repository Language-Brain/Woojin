<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>자료 안내 | 언어와 뇌</title><meta name="robots" content="index,follow"><link rel="stylesheet" href="/guides/guides.css"><style>
.document{padding:48px 0 80px}.document-head{display:block;width:100%;height:auto;border-bottom:1px solid var(--line);padding:0 0 24px;background:transparent}.document-kicker{margin:0;color:var(--navy);font-size:12px;font-weight:800;letter-spacing:.1em}.document-head h1{width:100%;max-width:none;font-size:36px;line-height:1.38;margin:8px 0 12px;word-break:keep-all;overflow-wrap:break-word}.document-head .meta{margin:0 0 10px}.document-head .tags{margin:0 0 14px}.document-head .summary{margin:0}.summary{font-size:17px;color:#505860;line-height:1.7}.meta{font-size:12px;color:var(--muted)}.document-body{font-size:17px;line-height:1.95;white-space:pre-wrap;padding:34px 0;word-break:keep-all}.document-body a{color:#135c9e;text-decoration:underline;text-underline-offset:3px}.reference-links{border-top:1px solid var(--line);padding-top:22px}.reference-links a{display:block;color:#135c9e;margin:9px 0}.video-frame{aspect-ratio:16/9;width:min(720px,100%);margin:25px auto}.video-frame iframe{width:100%;height:100%;border:0}.share{margin-top:30px;border:1px solid #b9c2ca;background:#fff;color:var(--navy);padding:11px 17px;cursor:pointer}.share-status{font-size:13px;color:var(--muted);margin-left:8px}@media(max-width:620px){.document{padding-top:32px}.document-head h1{font-size:27px}.document-body{font-size:16px}}
</style></head><body><header class="site-header"><a href="/">언어와 뇌</a><nav><a href="/guides">자료 검색</a><a href="/">홈</a></nav></header><main><article id="document" class="document"><p class="empty">자료를 불러오고 있습니다.</p></article></main>
<script src="/api/config"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
const fallback={supabaseUrl:'https://vhaosgzyvoijgwryybry.supabase.co',supabasePublishableKey:'sb_publishable_Obv4RYPtgwB71vZ4vOM0iA_jxPfeuZa'},config=window.LANGUAGE_BRAIN_CONFIG?.supabaseUrl?window.LANGUAGE_BRAIN_CONFIG:fallback,db=supabase.createClient(config.supabaseUrl,config.supabasePublishableKey),params=new URLSearchParams(location.search),id=params.get('id'),token=params.get('token'),root=document.querySelector('#document'),safeUrl=value=>{try{const u=new URL(String(value||''));return /^https?:$/.test(u.protocol)?u.href:''}catch{return''}},fmt=value=>value?new Date(value).toLocaleDateString('ko-KR'):'-';
function linkify(text){const frag=document.createDocumentFragment(),parts=String(text||'').split(/(https?:\/\/[^\s<]+)/g);parts.forEach(part=>{const url=safeUrl(part);if(url){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=part;frag.append(a)}else frag.append(document.createTextNode(part))});return frag}
function youtubeId(value){try{const u=new URL(value);if(u.hostname.includes('youtu.be'))return u.pathname.slice(1).split('/')[0];if(u.hostname.includes('youtube.com'))return u.searchParams.get('v')||u.pathname.split('/').filter(Boolean).pop()}catch{}return''}
async function load(){if(!id)return root.innerHTML='<p class="empty">자료 주소가 올바르지 않습니다.</p>';let row;if(token){const{data,error}=await db.rpc('get_unlisted_guide',{p_id:id,p_token:token});if(!error)row=data?.[0]}else{const{data}=await db.from('guides').select('*').eq('id',id).eq('status','active').eq('visibility','public').maybeSingle();row=data}if(!row)return root.innerHTML='<p class="empty">자료를 찾을 수 없거나 공개되지 않았습니다.</p>';document.title=row.title+' | 언어와 뇌';if(row.visibility==='unlisted')document.querySelector('meta[name=robots]').content='noindex,nofollow';root.replaceChildren();const head=document.createElement('header');head.className='document-head';head.innerHTML='<p class="document-kicker">자료 안내</p><h1></h1><p class="meta"></p><div class="tags"></div><p class="summary"></p>';head.querySelector('h1').textContent=row.title;head.querySelector('.summary').textContent=row.description;(row.tags||[]).forEach(t=>{const a=document.createElement('a');a.href='/guides?q='+encodeURIComponent(t);a.textContent='#'+t;head.querySelector('.tags').append(a)});head.querySelector('.meta').textContent='작성 '+fmt(row.created_at)+' · 수정 '+fmt(row.updated_at)+' · 조회 '+Number(row.view_count||0).toLocaleString();const body=document.createElement('div');body.className='document-body';body.append(linkify(row.body));root.append(head,body);const yid=youtubeId(row.youtube_url);if(yid){const frame=document.createElement('div');frame.className='video-frame';const iframe=document.createElement('iframe');iframe.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(yid);iframe.title='관련 YouTube 영상';iframe.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';iframe.allowFullscreen=true;frame.append(iframe);root.append(frame)}const links=Array.isArray(row.external_links)?row.external_links:[];if(links.length){const nav=document.createElement('nav');nav.className='reference-links';const strong=document.createElement('strong');strong.textContent='관련 링크';nav.append(strong);links.forEach(item=>{const url=safeUrl(item?.url);if(!url)return;const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=item.label||url;nav.append(a)});root.append(nav)}const share=document.createElement('button'),status=document.createElement('span');share.className='share';share.textContent='공유하기';share.setAttribute('aria-label','공유하기');status.className='share-status';root.append(share,status);share.addEventListener('click',async()=>{const data={title:row.title,text:row.description,url:location.href};try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(location.href);status.textContent='링크가 복사되었습니다';setTimeout(()=>status.textContent='',2500)}}catch(e){if(e.name!=='AbortError')status.textContent=location.href}});db.rpc('increment_guide_view',{p_guide_id:id,p_token:token||null})}
load();
</script></body></html>
